name: Package checks
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
permissions:
  contents: read
env:
  ARBOR_V2_LOCAL: '1'
jobs:
  package:
    name: ${{ matrix.package }} / Elixir ${{ matrix.toolchain.elixir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [arbor_rpc, arbor_acp, arbor_acp_adapters]
        toolchain:
          - {elixir: '1.17.3', otp: '27.0'}
          - {elixir: '1.19.5', otp: '28.3.1'}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - run: elixir ../../scripts/check_boundaries.exs
      - name: Build the publishable manifest without workspace overrides
        run: ARBOR_V2_LOCAL=0 mix hex.build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.package }}-${{ matrix.toolchain.elixir }}
          path: packages/${{ matrix.package }}/*.tar
  interop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/arbor_acp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.3.1'
          elixir-version: '1.19.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: mix deps.get
      - run: npm ci --ignore-scripts
        working-directory: packages/arbor_acp/test/interop
      - run: mix test --only interop_acp
  archive_consumer:
    name: Archive consumer / Elixir ${{ matrix.toolchain.elixir }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {elixir: '1.17.3', otp: '27.0'}
          - {elixir: '1.19.5', otp: '28.3.1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: ${{ matrix.toolchain.otp }}
          elixir-version: ${{ matrix.toolchain.elixir }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: arbor_*-${{ matrix.toolchain.elixir }}
          path: archive-consumer-input
          merge-multiple: true
      - run: python3 scripts/check_archive_consumer.py archive-consumer-input
